syntax = "proto3";

package raidkv.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/bachtg/raidkv/api/raidkv/v1;raidkvv1";


service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
  bytes key = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 10000
  }];
}

message GetResponse {
  bytes value = 1;
}

message PutRequest {
  bytes key = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 10000
  }];
  bytes value = 2;
}

message PutResponse {}

message DeleteRequest {
  bytes key = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 10000
  }];
}

message DeleteResponse {}

// ReplicationService lets a backup copy the primary's wal.
service ReplicationService {
  // ReadWAL returns fsynced records from seq `from`; OUT_OF_RANGE if a snapshot cut them.
  rpc ReadWAL(ReadWALRequest) returns (ReadWALResponse);
}

message ReadWALRequest {
  int64 from = 1 [(buf.validate.field).int64.gt = 0];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 10000
  }];
}

message ReadWALResponse {
  repeated WALRecord records = 1;
}

message WALRecord {
  int64 seq = 1;
  bool delete = 2;
  bytes key = 3;
  bytes value = 4;
}
